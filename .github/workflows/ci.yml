---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          pip install markdownlint-cli2 yamllint
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: Run lint
        run: make lint
      - name: Run tests
        run: make test
